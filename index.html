<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yosuda Rower Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 15px 20px 20px 20px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .track-container { 
            background-color: #0284c7;
            background-image: url('Fondo.png'), url('Fondo.PNG'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            background-position: center; 
            border-radius: 12px; 
            height: 230px; 
            margin-bottom: 15px; 
            border: 2px solid #334155; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        .lane { position: absolute; width: 100%; height: 80px; display: flex; align-items: center; }
        .ghost-lane { top: 73px; }
        .user-lane { top: 150px; }

        .boat-img { 
            position: absolute; 
            left: -35px; 
            height: 85px; 
            width: 140px; 
            object-fit: contain;
            transition: left 0.5s ease-out; 
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); 
        }
        .ghost-img { opacity: 0.9; }

        .lane-badge { 
            position: absolute; 
            right: 8px; 
            top: 30px; 
            font-size: 0.65rem; 
            color: #ffffff; 
            background: rgba(15, 23, 42, 0.85); 
            padding: 3px 7px; 
            border-radius: 4px; 
            font-weight: bold; 
            text-transform: uppercase; 
            z-index: 2; 
        }

        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }
        .countdown-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
            animation: pulse 0.8s infinite alternate;
        }

        .diff-container { margin: 12px 0; }
        .diff-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 6px; }
        .diff-buttons { display: flex; gap: 6px; justify-content: center; }
        .btn-diff { 
            flex: 1; padding: 8px 4px; font-size: 0.75rem; font-weight: bold; 
            background: #0f172a; color: #94a3b8; border: 1px solid #334155; 
            border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 0; 
        }
        .btn-diff.active { background: #0284c7; color: white; border-color: #38bdf8; }

        .metrics-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .metric { background: #0f172a; border-radius: 12px; padding: 8px; border: 1px solid #334155; }
        
        .metric-main { padding: 6px 12px; }
        .metric-main .value { font-size: 2.2rem; line-height: 1.1; margin-top: 0; }
        
        .metrics-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .metrics-row .value { font-size: 1.3rem; }
        .metrics-row .label { font-size: 0.62rem; }
        .metrics-row .unit { font-size: 0.62rem; }

        .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .value { font-weight: 800; color: #38bdf8; margin-top: 2px; }
        .unit { font-size: 0.7rem; color: #94a3b8; }
        
        button { margin-top: 10px; width: 100%; padding: 12px; font-size: 0.9rem; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); background: #0369a1; }
        .btn-save { background: #10b981; }
        .btn-save:active { background: #059669; }
        #status { font-size: 0.85rem; color: #f59e0b; margin-top: 10px; font-weight: 600; }

        /* Tarjeta de Registros con Usuario */
        .history-section { margin-top: 20px; border-top: 1px solid #334155; padding-top: 12px; text-align: left; }
        .history-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        
        .history-card { 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 10px; 
            padding: 10px 14px; 
            margin-bottom: 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
        }

        .history-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .history-stats-col { 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            font-size: 0.85rem; 
            font-weight: bold; 
        }
        .stat-line { display: flex; gap: 8px; align-items: center; }
        .stat-label-white { color: #ffffff; }
        .stat-label-orange { color: #f97316; }
        .stat-label-red { color: #f43f5e; }
        .stat-val-white { color: #ffffff; }
        .stat-val-orange { color: #f97316; }
        .stat-val-red { color: #f43f5e; }

        .history-user-center {
            font-size: 1.25rem;
            font-weight: 800;
            color: #38bdf8;
            text-align: center;
            flex: 1;
            padding: 0 5px;
        }

        .history-right-col { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 2px; 
        }
        .history-date { font-size: 0.72rem; color: #94a3b8; font-weight: bold; }
        .time-box { text-align: right; margin-top: 2px; }
        .time-label-red { font-size: 0.75rem; color: #ef4444; font-weight: bold; text-transform: uppercase; display: block; line-height: 1; }
        .time-val-red { font-size: 1.5rem; color: #ef4444; font-weight: 900; line-height: 1.1; }

        .history-bottom { 
            font-size: 0.76rem; 
            font-weight: bold; 
            color: #34d399; 
            margin-top: 0px; 
        }

        /* Modal de guardado */
        .save-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; padding: 20px; box-sizing: border-box;
        }
        .save-modal-box {
            background: #1e293b; border-radius: 16px; padding: 20px;
            max-width: 400px; width: 100%; text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .save-modal-title { font-size: 1.1rem; font-weight: 800; color: white; margin-bottom: 14px; text-align: center; }
        .name-input {
            width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1rem;
            border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;
            margin-bottom: 16px;
        }
        .force-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .force-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
        .btn-force {
            padding: 10px 0; font-size: 0.9rem; font-weight: bold;
            background: #0f172a; color: #94a3b8; border: 1px solid #334155;
            border-radius: 8px; cursor: pointer; margin: 0;
        }
        .btn-force.active { background: #0284c7; color: white; border-color: #38bdf8; }
        .save-modal-actions { display: flex; gap: 10px; }
        .save-modal-actions button { margin-top: 0; }
        .btn-cancel { background: #334155; }
        .btn-cancel:active { background: #1e293b; }

        /* Leaderboard */
        .leaderboard-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 10px;
            padding: 10px 14px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .lb-rank { font-size: 1.1rem; font-weight: 900; color: #facc15; width: 28px; }
        .lb-name { font-size: 1rem; font-weight: 800; color: #38bdf8; flex: 1; }
        .lb-stats { text-align: right; font-size: 0.8rem; color: #94a3b8; }
        .lb-kmh { color: #34d399; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="track-container">
        <div id="countdownOverlay" class="countdown-overlay" style="display: none;">
            <div id="countdownText" class="countdown-text">5</div>
        </div>

        <div class="lane ghost-lane">
            <img id="ghostBoat" class="boat-img ghost-img" src="barco_fantasma.PNG" onerror="this.src='barco_fantasma.png'" alt="Bot">
            <span id="ghostBadge" class="lane-badge">Bot</span>
        </div>
        <div class="lane user-lane">
            <img id="userBoat" class="boat-img" src="barco_usuario.PNG" onerror="this.src='barco_usuario.png'" alt="Tú">
            <span class="lane-badge">Tú</span>
        </div>
    </div>

    <div class="diff-container">
        <span class="diff-label">Dificultad Fantasma</span>
        <div class="diff-buttons">
            <button class="btn-diff active" onclick="setDifficulty(5, this, 'Fácil')">Fácil (5)</button>
            <button class="btn-diff" onclick="setDifficulty(6.5, this, 'Medio')">Medio (6.5)</button>
            <button class="btn-diff" onclick="setDifficulty(9, this, 'Difícil')">Difícil (9)</button>
        </div>
    </div>

    <div class="metrics-wrapper">
        <div class="metric metric-main">
            <div class="label">Tiempo</div>
            <div class="value" id="time">00:00</div>
        </div>
        <div class="metrics-row">
            <div class="metric">
                <div class="label">Velocidad</div>
                <div class="value" id="kmh">0.0</div>
                <div class="unit">km/h</div>
            </div>
            <div class="metric">
                <div class="label">Paladas</div>
                <div class="value" id="cnt">0</div>
                <div class="unit">repeticiones</div>
            </div>
            <div class="metric">
                <div class="label">Calorías</div>
                <div class="value" id="kcal">0</div>
                <div class="unit">kcal</div>
            </div>
        </div>
    </div>

    <div id="status">Desconectado</div>
    <button onclick="connectBT()">CONECTAR REMADORA</button>
    <button class="btn-save" onclick="saveSession()">GUARDAR ENTRENAMIENTO</button>

    <div class="history-section">
        <div class="history-title">🏆 Mejor Marca por Persona</div>
        <div id="leaderboardList" class="history-list">
        </div>
    </div>

    <div class="history-section">
        <div class="history-title">Últimos Registros</div>
        <div id="historyList" class="history-list">
        </div>
    </div>
</div>

<div id="saveModal" class="save-modal-overlay" style="display: none;">
    <div class="save-modal-box">
        <div class="save-modal-title">Guardar entrenamiento</div>
        <input type="text" id="nameInput" class="name-input" placeholder="Nombre de quién remó">
        <div class="force-label">Nivel de fuerza</div>
        <div class="force-grid" id="forceGrid"></div>
        <div class="save-modal-actions">
            <button class="btn-cancel" onclick="closeSaveModal()">Cancelar</button>
            <button class="btn-save" onclick="confirmSaveSession()">Guardar</button>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxs5RkbQS_59SlzVXSHOwm1mITH34RXxtmG73FvntTDv3dFhrbCdGX8joDmLE98HpH_/exec';

    let startTime = null;
    let ghostInterval = null;
    let targetKmh = 3.5;
    let currentDifficultyName = "Fácil";
    let isRaceStarted = false;
    const TRACK_LENGTH_M = 100; // metros por "vuelta" visual en el track

    let userDistanceM = 0;
    let ghostDistanceM = 0;
    let lastPaceTime = null;
    let selectedFuerza = null;

    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log(`Error Wake Lock: ${err.message}`);
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        renderForceButtons();
        fetchRecords();
        requestWakeLock();
    });

    function setDifficulty(kmh, btn, name) {
        targetKmh = kmh;
        currentDifficultyName = name;
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('ghostBadge').innerText = "Bot";
    }

    function startRaceCountdown() {
        if (isRaceStarted) return;
        isRaceStarted = true;

        const overlay = document.getElementById('countdownOverlay');
        const text = document.getElementById('countdownText');
        overlay.style.display = 'flex';
        
        let count = 5;
        text.innerText = count;

        let timer = setInterval(() => {
            count--;
            if (count > 0) {
                text.innerText = count;
            } else if (count === 0) {
                text.innerText = "¡A REMAR!";
            } else {
                clearInterval(timer);
                overlay.style.display = 'none';
                startTime = Date.now();
                startGhost();
            }
        }, 1000);
    }

    async function connectBT() {
        const statusEl = document.getElementById('status');
        try {
            statusEl.innerText = "Buscando máquina...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'YOSUDA' }],
                optionalServices: ['fitness_machine']
            });

            statusEl.innerText = "Conectando...";
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('fitness_machine');
            
            const char = await service.getCharacteristic('00002ad1-0000-1000-8000-00805f9b34fb');
            await char.startNotifications();

            statusEl.innerText = "¡CONECTADO!";
            statusEl.style.color = "#22c55e";

            startRaceCountdown();

            char.addEventListener('characteristicvaluechanged', (e) => {
                let data = new DataView(e.target.value.buffer);
                let bytes = new Uint8Array(e.target.value.buffer);

                if (bytes.length >= 8 && bytes[0] === 0x7f) {
                    // Bytes 6-7: ritmo instantáneo (segundos por 500m). 0xFFFF = sin dato aún.
                    let paceRaw = bytes[6] + (bytes[7] << 8);
                    let kmh = 0;
                    if (paceRaw > 0 && paceRaw < 0xFFFF) {
                        kmh = 1800 / paceRaw;
                    }
                    document.getElementById('kmh').innerText = kmh.toFixed(1);

                    const now = Date.now();
                    if (lastPaceTime !== null) {
                        const dtSec = (now - lastPaceTime) / 1000;
                        if (dtSec > 0 && dtSec < 5) { // ignora saltos raros (reconexión, etc.)
                            userDistanceM += (kmh * 1000 / 3600) * dtSec;
                        }
                    }
                    lastPaceTime = now;

                    let userPos = Math.min((userDistanceM % TRACK_LENGTH_M) / TRACK_LENGTH_M * 68, 68);
                    document.getElementById('userBoat').style.left = `calc(${userPos}% - 35px)`;
                }
                else if (bytes[0] === 0x00 && bytes.length >= 8) {
                    let countVal = data.getUint16(3, true);
                    let caloriesVal = data.getUint16(5, true);

                    document.getElementById('cnt').innerText = countVal;
                    document.getElementById('kcal').innerText = caloriesVal;

                    if (startTime) {
                        let elapsedSecs = Math.floor((Date.now() - startTime) / 1000);
                        let tMins = Math.floor(elapsedSecs / 60).toString().padStart(2, '0');
                        let tSecs = (elapsedSecs % 60).toString().padStart(2, '0');
                        document.getElementById('time').innerText = `${tMins}:${tSecs}`;
                    }
                }
            });

        } catch (error) {
            statusEl.innerText = "Error: " + error.message;
            statusEl.style.color = "#ef4444";
        }
    }

    function startGhost() {
        if (ghostInterval) clearInterval(ghostInterval);
        const tickMs = 200;
        let lastTick = Date.now();
        ghostInterval = setInterval(() => {
            const now = Date.now();
            const dtSec = (now - lastTick) / 1000;
            lastTick = now;
            ghostDistanceM += (targetKmh * 1000 / 3600) * dtSec;
            let ghostPos = Math.min((ghostDistanceM % TRACK_LENGTH_M) / TRACK_LENGTH_M * 68, 68);
            document.getElementById('ghostBoat').style.left = `calc(${ghostPos}% - 35px)`;
        }, tickMs);
    }

    function timeToSeconds(timeStr) {
        const [m, s] = timeStr.split(':').map(Number);
        return (m || 0) * 60 + (s || 0);
    }

    function renderForceButtons() {
        const grid = document.getElementById('forceGrid');
        grid.innerHTML = '';
        for (let n = 6; n <= 16; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-force';
            btn.innerText = n;
            btn.onclick = () => {
                selectedFuerza = n;
                document.querySelectorAll('.btn-force').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
            grid.appendChild(btn);
        }
    }

    function saveSession() {
        const time = document.getElementById('time').innerText;
        const strokes = document.getElementById('cnt').innerText;

        if (strokes === "0" && time === "00:00") {
            alert("No hay datos de entrenamiento para guardar.");
            return;
        }

        document.getElementById('nameInput').value = '';
        selectedFuerza = null;
        renderForceButtons();
        document.getElementById('saveModal').style.display = 'flex';
    }

    function closeSaveModal() {
        document.getElementById('saveModal').style.display = 'none';
    }

    async function confirmSaveSession() {
        const nameInput = document.getElementById('nameInput');
        const userName = nameInput.value.trim();

        if (userName === '') {
            alert('Escribe el nombre de quién remó.');
            return;
        }
        if (!selectedFuerza) {
            alert('Selecciona el nivel de fuerza usado.');
            return;
        }

        const time = document.getElementById('time').innerText;
        const strokes = parseInt(document.getElementById('cnt').innerText) || 0;
        const kcal = parseInt(document.getElementById('kcal').innerText) || 0;
        const tiempoSeg = timeToSeconds(time);
        const distanciaEstKm = userDistanceM / 1000;
        const kmhProm = tiempoSeg > 0 ? (distanciaEstKm / (tiempoSeg / 3600)) : 0;

        const record = {
            nombre: userName,
            fecha: new Date().toISOString(),
            tiempoSeg: tiempoSeg,
            paladas: strokes,
            calorias: kcal,
            kmhProm: Number(kmhProm.toFixed(2)),
            distanciaEstKm: Number(distanciaEstKm.toFixed(3)),
            fuerza: selectedFuerza,
            dificultad: currentDifficultyName
        };

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(record)
            });
            closeSaveModal();
            alert('¡Entrenamiento guardado con éxito!');
            fetchRecords();
        } catch (err) {
            alert('No se pudo guardar en la nube. Revisa tu conexión e intenta de nuevo.');
        }
    }

    async function fetchRecords() {
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            renderHistory(data.recientes || []);
            renderLeaderboard(data.leaderboard || []);
        } catch (err) {
            document.getElementById('historyList').innerHTML = '<div style="color:#64748b; font-size:0.8rem; padding: 10px 0;">No se pudieron cargar los registros.</div>';
            document.getElementById('leaderboardList').innerHTML = '';
        }
    }

    function formatFecha(fechaStr) {
        try {
            return new Date(fechaStr).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' });
        } catch (e) {
            return fechaStr;
        }
    }

    function secondsToTime(totalSecs) {
        const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
        const s = Math.floor(totalSecs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function renderHistory(registros) {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        if (registros.length === 0) {
            historyList.innerHTML = '<div style="color:#64748b; font-size:0.8rem; padding: 10px 0;">Sin registros aún.</div>';
            return;
        }

        registros.forEach(item => {
            const card = document.createElement('div');
            card.className = 'history-card';

            card.innerHTML = `
                <div class="history-top">
                    <div class="history-stats-col">
                        <div class="stat-line">
                            <span class="stat-label-white">Remadas:</span>
                            <span class="stat-val-white">${item.paladas}</span>
                        </div>
                        <div class="stat-line">
                            <span class="stat-label-orange">Kcalorias:</span>
                            <span class="stat-val-orange">${item.calorias}</span>
                        </div>
                        <div class="stat-line">
                            <span class="stat-label-red">Km/h prom:</span>
                            <span class="stat-val-red">${item.kmhProm}</span>
                        </div>
                    </div>
                    
                    <div class="history-user-center">${item.nombre}</div>

                    <div class="history-right-col">
                        <div class="history-date">${formatFecha(item.fecha)}</div>
                        <div class="time-box">
                            <span class="time-label-red">TIEMPO:</span>
                            <span class="time-val-red">${secondsToTime(item.tiempoSeg)}</span>
                        </div>
                    </div>
                </div>
                <div class="history-bottom">
                    Fuerza: ${item.fuerza} &nbsp;/&nbsp; Dificultad: ${item.dificultad}
                </div>
            `;
            historyList.appendChild(card);
        });
    }

    function renderLeaderboard(leaderboard) {
        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';

        if (leaderboard.length === 0) {
            list.innerHTML = '<div style="color:#64748b; font-size:0.8rem; padding: 10px 0;">Sin registros aún.</div>';
            return;
        }

        leaderboard.forEach((item, i) => {
            const row = document.createElement('div');
            row.className = 'leaderboard-card';
            row.innerHTML = `
                <span class="lb-rank">#${i + 1}</span>
                <span class="lb-name">${item.nombre}</span>
                <span class="lb-stats"><span class="lb-kmh">${item.kmhProm} km/h</span><br>${secondsToTime(item.tiempoSeg)}</span>
            `;
            list.appendChild(row);
        });
    }
</script>

</body>
</html>
